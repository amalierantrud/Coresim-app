# Alle sok bruker disse, saa indeks og kilde bare staar ett sted.
[ot_packets]
definition = index=anomaly_detection source="tcp:9998"

[ot_summary]
definition = index=ot_summary

[ot_alerts]
definition = index=ot_alerts

[ot_incidents]
definition = index=ot_incidents

# Host events: bytt definisjonen naar dere vet hva som kommer fra simulator-maskinene.
# Feltene som trengs: _time, host_ip, kind, detail, user, suspicious
[ot_host_events]
definition = | inputlookup host_events.csv | eval _time=coalesce(tonumber(time), strptime(time, "%Y-%m-%dT%H:%M:%S%z"))
