# Tolker tcpdump-linjene fra coresim-ws (index=anomaly_detection, source=tcp:9998).
# Bare sokstids-regler, saa de ikke endrer hvordan data lagres paa coresim.
[source::tcp:9998]
EXTRACT-addr   = IP (?<src_ip>\d+\.\d+\.\d+\.\d+)(?:\.(?<src_port>\d+))? > (?<dest_ip>\d+\.\d+\.\d+\.\d+)(?:\.(?<dest_port>\d+))?:
EXTRACT-length = length (?<length>\d+)
EXTRACT-flags  = Flags \[(?<tcp_flags>[^\]]+)\]
EVAL-proto     = case(match(_raw, "UDP, length"), "UDP", isnotnull(tcp_flags), "TCP", match(_raw, "HSRP"), "HSRP", true(), "annet")
EVAL-syn       = if(isnotnull(tcp_flags) AND match(tcp_flags, "^S$"), 1, 0)
EVAL-multicast = if(cidrmatch("224.0.0.0/4", dest_ip), 1, 0)
