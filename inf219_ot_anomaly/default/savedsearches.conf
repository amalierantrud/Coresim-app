# Live-kjeden. Alle er AV (enableSched = 0) til de er testet - slaa paa en og en.

[OT 1 - Oppsummer per minutt]
description = Teller opp forrige minutts pakker per kilde/maal/protokoll til index=ot_summary.
search = `ot_packets` | bin _time span=1m \
| stats count as packets sum(length) as bytes dc(dest_port) as dest_ports sum(syn) as syn by _time src_ip dest_ip proto \
| collect index=ot_summary
cron_schedule = * * * * *
dispatch.earliest_time = -2m@m
dispatch.latest_time = -1m@m
enableSched = 0

[OT 2 - Deteksjon (Python)]
description = Kjorer otdetect paa forrige minutts oppsummering og lagrer avvik i index=ot_alerts.
search = `ot_summary` | otdetect k=4 | collect index=ot_alerts
cron_schedule = * * * * *
# ett minutt etter OT 1, saa oppsummeringen er ferdig skrevet
dispatch.earliest_time = -3m@m
dispatch.latest_time = -2m@m
enableSched = 0

[OT 3 - Diagnose (Python)]
description = Slaar sammen avvik og host events fra siste 15 min til hendelser i index=ot_incidents.
search = `ot_alerts` | append [`ot_host_events`] | otdiagnose | collect index=ot_incidents
cron_schedule = * * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 0

[OT - Bygg baseline]
description = Laerer normalnivaa fra en periode med normal drift og skriver lookups/ot_baseline.csv. Velg tidsrom selv.
search = `ot_summary` | otbaseline
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 0
