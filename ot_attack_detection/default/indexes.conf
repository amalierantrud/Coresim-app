# Normaltrafikken fra NORCE, holdt adskilt fra testdataene i anomaly_detection.
[baseline]
homePath = $SPLUNK_DB/baseline/db
coldPath = $SPLUNK_DB/baseline/colddb
thawedPath = $SPLUNK_DB/baseline/thaweddb

# Opptak (pcap) gjort om med tools/pcap_til_splunk.py, uten kopier. Ett opptak per source (filnavn).
[opptak]
homePath = $SPLUNK_DB/opptak/db
coldPath = $SPLUNK_DB/opptak/colddb
thawedPath = $SPLUNK_DB/opptak/thaweddb

# Gammel: angrepsøkten 29. september 2026 med alle kopiene. Brukes ikke lenger, kan slettes i Splunk.
[capture]
homePath = $SPLUNK_DB/capture/db
coldPath = $SPLUNK_DB/capture/colddb
thawedPath = $SPLUNK_DB/capture/thaweddb
