# Lager fasiten lookups/baseline_trafikk.csv fra index=baseline. Kjøres for hånd når dere får en ny baseline:
# Settings → Searches, reports, and alerts → "Lag baseline" → Run.
# Én rad per strøm (avsender, mottaker, port, størrelse) med normal MAC og normal rate per 10 sekunder.
# Første og siste vindu er med bare delvis, så de holdes utenfor rate-tallene.
[Lag baseline]
description = Regner ut normal trafikk per strøm fra index=baseline og lagrer den i baseline_trafikk.csv
dispatch.earliest_time = 0
dispatch.latest_time = now
search = index=baseline udp.udp_dstport=* \
| rename ip.ip_src AS src_ip, ip.ip_dst AS dst_ip, udp.udp_dstport AS dst_port, udp.udp_length AS udp_len, eth.eth_src AS src_mac \
| eval len=udp_len-8, strom=src_ip."|".dst_ip."|".dst_port."|".len \
| bin _time span=10s \
| stats count AS n by _time strom \
| xyseries _time strom n \
| makecontinuous _time span=10s \
| fillnull value=0 \
| eventstats min(_time) AS forste max(_time) AS siste \
| where _time>forste AND _time<siste \
| fields - forste siste \
| untable _time strom n \
| stats avg(n) AS snitt_10s stdev(n) AS stdev_10s min(n) AS min_10s max(n) AS maks_10s by strom \
| join type=left strom \
    [search index=baseline udp.udp_dstport=* \
    | eval strom='ip.ip_src'."|".'ip.ip_dst'."|".'udp.udp_dstport'."|".('udp.udp_length'-8) \
    | stats count AS pakker values(eth.eth_src) AS src_mac by strom \
    | eval src_mac=mvjoin(src_mac, " ")] \
| rex field=strom "^(?<src_ip>[^|]+)\|(?<dst_ip>[^|]+)\|(?<dst_port>[^|]+)\|(?<len>.+)$" \
| eval snitt_10s=round(snitt_10s, 1), stdev_10s=round(stdev_10s, 2), kjent="ja" \
| sort - pakker \
| table src_ip dst_ip dst_port len src_mac pakker snitt_10s stdev_10s min_10s maks_10s kjent \
| outputlookup baseline_trafikk.csv
