# Felt for nettverkstrafikken fra coresim-ws.
# Feltene er knyttet til sourcetype (ikke host), slik at tcpdump-linjene og tshark-JSON
# kan ha samme host uten at innstillingene overstyrer hverandre.
# Begge formatene får de samme feltnavnene: src_ip, src_port, dst_ip, dst_port, len, protokoll.
# Da virker Oversikt og Avvik på begge.
 
# ---------------------------------------------------------------------------
# tcpdump-linjer: indeksen anomaly_detection på coresim, og testdata eksportert derfra
# Eksempel: 2025-11-20 12:00:04.995562 IP 192.168.10.116.11611 > 224.10.10.116.21611: UDP, length 480
# ---------------------------------------------------------------------------
[generic_single_line]
EXTRACT-tcpdump = ^\S+ \S+ (?<proto>[A-Z0-9]+),? (?:(?<src_ip>\d+\.\d+\.\d+\.\d+)\.(?<src_port>\d+) > (?<dst_ip>\d+\.\d+\.\d+\.\d+)\.(?<dst_port>\d+): (?<transport>\w+))?.*length (?<len>\d+)
 
# Feltet protokoll: hva slags pakke linja er. Brukes i Oversikt og Avvik.
# Linjer som starter med innrykk er hex-innholdet i en pakke og får ingen protokoll.
# Alt vi ikke kjenner igjen blir "Annet".
EVAL-protokoll = case(match(_raw, "^\s"), null(), match(_raw, ": UDP,"), "UDP", match(_raw, "HSRP"), "HSRP", match(_raw, "^\S+ \S+ ARP"), "ARP", match(_raw, "^\S+ \S+ STP"), "STP", match(_raw, "^\S+ \S+ CDP"), "CDP", match(_raw, "^\S+ \S+ DTP"), "DTP", true(), "Annet")
 
# ---------------------------------------------------------------------------
# Angrepsopptaket som CSV fra tshark, testdata/capture.csv. Én pakke per linje.
# Dette formatet har src_mac, som regelen Feil MAC i bin/deteksjon.py trenger.
# ---------------------------------------------------------------------------
[capture_csv]
INDEXED_EXTRACTIONS = csv
FIELD_NAMES = tid,src_mac,src_ip,dst_ip,dst_port,udp_len,protokoller
TIMESTAMP_FIELDS = tid
TIME_FORMAT = %s.%9N
SHOULD_LINEMERGE = false
KV_MODE = none

# tshark sin udp_length tar med 8 byte UDP-header, se [coresim:tshark].
EVAL-len = udp_len-8
EVAL-protokoll = case(match(protokoller, ":hsrp"), "HSRP", match(protokoller, ":udp"), "UDP", match(protokoller, ":arp"), "ARP", match(protokoller, ":stp"), "STP", match(protokoller, ":cdp"), "CDP", match(protokoller, ":dtp"), "DTP", true(), "Annet")

# ---------------------------------------------------------------------------
# tshark-JSON (tshark -T ek), for eksempel testdata/baseline_clean.json
# Én linje er én pakke. Tiden står i feltet "timestamp" i millisekunder siden 1970.
# ---------------------------------------------------------------------------
[coresim:tshark]
CHARSET = UTF-8
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
KV_MODE = json
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 13
 
# Samme feltnavn som i tcpdump-dataene
FIELDALIAS-ip = ip.ip_src AS src_ip ip.ip_dst AS dst_ip
FIELDALIAS-udp = udp.udp_srcport AS src_port udp.udp_dstport AS dst_port
 
# tcpdump sin "length" er UDP-innholdet, mens udp_length tar med 8 byte UDP-header.
# Uten justeringen blir 240 til 248, og ingenting stemmer med kjent_trafikk.csv.
EVAL-len = 'udp.udp_length' - 8
 
# Protokoll ut fra protokollstien til tshark, for eksempel eth:ethertype:ip:udp:data.
# HSRP sjekkes før UDP, fordi HSRP går over UDP (ip:udp:hsrp).
EVAL-protokoll = case(match('frame.frame_protocols', ":hsrp"), "HSRP", match('frame.frame_protocols', ":udp"), "UDP", match('frame.frame_protocols', ":arp"), "ARP", match('frame.frame_protocols', ":stp"), "STP", match('frame.frame_protocols', ":cdp"), "CDP", match('frame.frame_protocols', ":dtp"), "DTP", true(), "Annet")
 
[capture_csv]
pulldown_type = true
category = Custom
CHARSET = UTF-8
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %s.%9N
MAX_TIMESTAMP_LOOKAHEAD = 20

EXTRACT-capture = ^(?<tid>[^,]*),(?<src_mac>[^,]*),(?<src_ip>[^,]*),(?<dst_ip>[^,]*),(?<dst_port>[^,]*),(?<udp_len>[^,]*),(?<protokoller>[^,]*)$

# Som for tshark: udp_len tar med 8 byte UDP-header, tcpdump sin length gjør ikke det.
EVAL-len = if(udp_len != "", tonumber(udp_len) - 8, null())

# Protokoll ut fra protokollstien, samme regler som for tshark.
EVAL-protokoll = case(match(protokoller, ":hsrp"), "HSRP", match(protokoller, ":udp"), "UDP", match(protokoller, ":arp"), "ARP", match(protokoller, ":stp"), "STP", match(protokoller, ":cdp"), "CDP", match(protokoller, ":dtp"), "DTP", true(), "Annet")