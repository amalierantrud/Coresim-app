# Pakker fra Convert-PcapToSplunkJson.ps1: én JSON-pakke per linje.
# Tiden står i feltet timestamp som millisekunder siden 1970 (UTC).
# TRUNCATE = 0 hindrer at lange pakker kuttes og blir ugyldig JSON.
[baseline_json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 13
KV_MODE = json

# Angrepsopptaket: én kommaseparert pakke per linje, laget med tshark fra capture.pcap.
# len er innholdet i UDP-pakken, samme mål som i baseline_trafikk.csv.
# protokoll får samme navn som i tcpdump-dataene, så lookup og dashboards virker likt.
[capture_csv]
INDEXED_EXTRACTIONS = csv
FIELD_NAMES = tid,src_mac,src_ip,dst_ip,dst_port,udp_len,protokoller
TIMESTAMP_FIELDS = tid
TIME_FORMAT = %s.%9N
SHOULD_LINEMERGE = false
KV_MODE = none
EVAL-len = udp_len-8
EVAL-protokoll = case(match(protokoller, ":hsrp"), "HSRP", match(protokoller, ":udp"), "UDP", match(protokoller, ":arp"), "ARP", match(protokoller, ":stp"), "STP", match(protokoller, ":cdp"), "CDP", match(protokoller, ":dtp"), "DTP", true(), "Annet")