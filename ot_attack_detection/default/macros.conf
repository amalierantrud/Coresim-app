# Hvor dashboardene henter pakkene fra. Brukes som `ot_data` i søkene.
# index=opptak: pcap-opptak lastet inn lokalt med tools/pcap_til_splunk.py (uten kopier).
# index=anomaly_detection: nettverkstrafikken på coresim (splunk.coresim.no).
# Hver Splunk har bare én av dem, så samme app virker begge steder.
[ot_data]
definition = (index=opptak) OR (index=anomaly_detection host=coresim-ws.openlab.local)
