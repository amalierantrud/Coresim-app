# Hvor dashboardet henter pakkene fra. Brukes som `ot_data` i søkene.
# index=capture: angrepsopptaket i den lokale Splunk-en.
# index=anomaly_detection: nettverkstrafikken på coresim (splunk.coresim.no).
# Hver Splunk har bare én av dem, så samme app virker begge steder.
[ot_data]
definition = (index=capture) OR (index=anomaly_detection host=coresim-ws.openlab.local)
